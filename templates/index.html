<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seolflix 가구 업데이트 관리 서버</title>
  <style>
    /* 다크모드 배경 */
    body {
      background-color: #121212;
      color: #ccc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      margin: 0;
      padding: 0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: flex-start;
      padding-top: 60px;
    }

    /* 메인 제목 (파스텔 노란색) */
    h1 {
      color: #f7e8a8; /* 파스텔 노란색 */
      font-size: 2.5rem;
      text-align: center;
      margin-bottom: 8px;
    }

    /* 서브 텍스트 */
    p.subtitle {
      color: #ffd6e8; /* 파스텔 핑크 */
      font-size: 0.9rem;
      margin-top: 0;
      margin-bottom: 30px;
      text-align: center;
    }

    /* 이모티콘 스타일 */
    .emoji {
      font-size: 1.6rem;
      vertical-align: middle;
      margin: 0 8px;
    }

    /* 메일 목록 스타일 */
    .email-list {
      width: 90%;
      max-width: 900px;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    /* 각 메일 카드 */
    .email-card {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 10px rgba(247, 168, 168, 0.3);
      color: #ddd;
    }

    .email-card h2 {
      margin: 0 0 6px 0;
      font-weight: 700;
      color: #f7e8a8; /* 파스텔 노란색 제목과 통일 */
    }

    .email-card .from-date {
      font-size: 0.85rem;
      color: #8fbcbb;
      margin-bottom: 14px;
    }

    /* 넷플릭스 버튼 (파스텔 연한 빨간색) */
    .btn-netflix {
      display: inline-block;
      padding: 10px 18px;
      background-color: #f7a8a8; /* 파스텔 연한 빨간색 */
      color: white;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    .btn-netflix:hover {
      background-color: #d67272; /* 호버 시 더 진한 빨간색 */
    }

    /* 일반 a 태그 색상 변경 (넷플릭스 버튼 제외) */
    .email-body a:not(.btn-netflix) {
      color: #f7a8a8; /* 연한 빨간색 */
      text-decoration: underline;
    }

    .email-body a:not(.btn-netflix):hover {
      color: #d67272;
    }
  </style>
</head>
<body>
  <h1>
    <span class="emoji">🎬</span>
    Seolflix 가구 업데이트 관리 서버
    <span class="emoji">🎥</span>
  </h1>
  <p class="subtitle">
    <span class="emoji">🔔</span>
    Netflix 가구 업데이트를 실시간으로 인증할 수 있습니다!
    <span class="emoji">✅</span>
  </p>

  <div class="email-list">
    {% for email in emails %}
    <div class="email-card">
      <h2>{{ email.subject }}</h2>
      <div class="from-date">
        From: {{ email.from }} | Date: {{ email.date }}
      </div>
      <div class="email-body">
        {{ email.body | safe }}
      </div>
    </div>
    {% endfor %}
  </div>
</body>
</html>
