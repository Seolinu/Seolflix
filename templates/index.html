<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Seolflix 가구 업데이트 관리 서버</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      height: 100%;
      background-color: #121212;
      color: #ccc;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    h1 {
      color: #f7e8a8;
      font-size: 2.5rem;
      text-align: center;
      margin-top: 60px;
      margin-bottom: 8px;
    }

    p.subtitle {
      color: #ffd6e8;
      font-size: 0.9rem;
      text-align: center;
      margin: 0 0 30px 0;
    }

    .emoji {
      font-size: 1.6rem;
      vertical-align: middle;
      margin: 0 8px;
    }

    .email-list {
      width: 90%;
      max-width: 900px;
      margin: 0 auto 40px auto;
      display: flex;
      flex-direction: column;
      gap: 25px;
    }

    .email-card {
      background-color: #1e1e1e;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 10px rgba(247, 168, 168, 0.3);
      color: #ddd;
    }

    .email-card h2 {
      margin: 0 0 6px 0;
      font-weight: 700;
      color: #f7e8a8;
    }

    .email-card .from-date {
      font-size: 0.85rem;
      color: #8fbcbb;
      margin-bottom: 14px;
    }

    .btn-netflix {
      display: inline-block;
      padding: 10px 18px;
      background-color: #f7a8a8;
      color: white;
      border-radius: 6px;
      text-decoration: none;
      font-weight: bold;
      transition: background-color 0.3s ease;
    }

    .btn-netflix:hover {
      background-color: #d67272;
    }

    .email-body a:not(.btn-netflix) {
      color: #f7a8a8;
      text-decoration: underline;
    }

    .email-body a:not(.btn-netflix):hover {
      color: #d67272;
    }
  </style>
</head>
<body>
  <h1>
    <span class="emoji">🎬</span>
    Seolflix 가구 업데이트 관리 서버
    <span class="emoji">🎥</span>
  </h1>
  <p class="subtitle">
    <span class="emoji">🔔</span>
    Netflix 가구 업데이트를 실시간으로 인증할 수 있습니다!
    <span class="emoji">✅</span>
  </p>

  <div class="email-list">
    {% for email in emails %}
    <div class="email-card">
      <h2>{{ email.subject }}</h2>
      <div class="from-date">
        From: {{ email.from }} | Date: {{ email.date }}
      </div>
      <div class="email-body">
        {{ email.body | safe }}
      </div>
    </div>
    {% endfor %}
  </div>
</body>
</html>
